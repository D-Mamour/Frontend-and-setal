<nav
  class="fixed bottom-0 left-1/2 z-50
         flex h-16 w-[calc(100%-20px)] max-w-[414px]
         -translate-x-1/2 items-center justify-around
         rounded-2xl border border-slate-100 bg-slate-50"
>

  <!-- Accueil -->
  <a
    routerLink="/"
    class="flex h-14 w-16 flex-col items-center justify-center gap-1
           text-slate-400"
  >
    <fa-icon
      [icon]="faHouse"
      class="text-[20px]"
    ></fa-icon>

    <span
      class="text-center font-['Inter'] text-[10px] font-bold leading-4"
    >
      Accueil
    </span>
  </a>


  <!-- Communauté -->
  <a
    routerLink="/communaute"
    class="flex h-14 w-20 flex-col items-center justify-center gap-1
           text-slate-400"
  >
    <fa-icon
      [icon]="faUsers"
      class="text-[20px]"
    ></fa-icon>

    <span
      class="text-center font-['Inter'] text-[10px] font-bold leading-4"
    >
      Communauté
    </span>
  </a>


  <!-- Bouton central -->
  <button
    type="button"
    class="-mt-7 flex h-16 w-16 shrink-0
           items-center justify-center
           rounded-full border-4 border-white
           bg-green-700 text-white
           shadow-[0_8px_10px_-6px_rgba(46,125,50,0.4)]
           shadow-[0_20px_25px_-5px_rgba(46,125,50,0.4)]"
  >
    <fa-icon
      [icon]="faCamera"
      class="text-[24px]"
    ></fa-icon>
  </button>


  <!-- Demande -->
  <a
    routerLink="/demande"
    class="flex h-14 w-16 flex-col items-center justify-center gap-1
           text-slate-400"
  >
    <fa-icon
      [icon]="faChartPie"
      class="text-[20px]"
    ></fa-icon>

    <span
      class="text-center font-['Inter'] text-[10px] font-bold leading-4"
    >
      Demande
    </span>
  </a>


  <!-- Profil -->
  <a
    routerLink="/profil"
    class="flex h-14 w-16 flex-col items-center justify-center gap-1
           text-slate-400"
  >
    <fa-icon
      [icon]="faCircleUser"
      class="text-[18px]"
    ></fa-icon>

    <span
      class="text-center font-['Inter'] text-[10px] font-bold leading-4"
    >
      Profil
    </span>
  </a>

</nav>
