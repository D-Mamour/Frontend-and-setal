<div class="min-h-screen bg-white flex flex-col px-6 pt-12 pb-8">
  <!-- Logo -->
  <div class="flex items-center gap-2 mb-8">
    <button type="button" (click)="goHome()" aria-label="Retour" class="flex size-12 items-center justify-center rounded-full bg-white shadow-md">
        <i class="fa-solid fa-arrow-left text-[#A9663D]" aria-hidden="true"></i>
      </button>
    <img src="images/logo.png" alt="Andë sétal" class="h-30 w-auto" />
  </div>

  <!-- Accroche -->
  <p class="text-gray-400 text-lg leading-relaxed mb-8">
    Accédez à votre espace pour un Dakar Plateau plus propre.
  </p>

  <h1 class="text-4xl font-extrabold text-gray-900 text-center mb-8">Connexion</h1>

    <ng-container *ngIf="errorMessage()">
      <p class="py-5 text-md text-red-600">{{ errorMessage() }}</p>
    </ng-container>

  <form [formGroup]="loginForm" (ngSubmit)="seConnecter()" class="flex flex-col gap-5">
    <!-- Numéro -->
    <div>
      <label for="email" class="block text-gray-500 font-bold text-sm tracking-wide uppercase mb-2">
        Email
      </label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="exemple@email.com"
        autocomplete="email"
        class="w-full bg-gray-100 rounded-2xl px-5 py-4 text-gray-700 placeholder-gray-400 outline-none focus:ring-2 focus:ring-green-700"
      />
      <ng-container *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        <p class="mt-1 text-xs text-red-600">
          <span *ngIf="loginForm.get('email')?.hasError('required')">L'adresse email est obligatoire.</span>
          <span *ngIf="loginForm.get('email')?.hasError('email')">Veuillez saisir une adresse email valide.</span>
        </p>
      </ng-container>
    </div>

    <!-- Code -->
    <div>
      <label for="password" class="block text-gray-500 font-bold text-sm tracking-wide uppercase mb-2">
        Mot de passe
      </label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Votre mot de passe"
        autocomplete="current-password"
        class="w-full bg-gray-100 rounded-2xl px-5 py-4 text-gray-700 placeholder-gray-400 outline-none focus:ring-2 focus:ring-green-700"
      />
      <ng-container *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <p class="mt-1 text-xs text-red-600">
          <span *ngIf="loginForm.get('password')?.hasError('required')">Mot de passe est obligatoire.</span>
          <span *ngIf="loginForm.get('password')?.hasError('minlength')">Minimum 8 caracteres.</span>
        </p>
      </ng-container>
    </div>

    <!-- Bouton connexion -->
    <button
      type="submit"
      [disabled]="loading()"
      class="mt-2 w-full rounded-2xl text-white font-bold py-4 flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed active:scale-[0.99] transition"
      style="background-color: #2E7D32;">
      <ng-container *ngIf="loading(); else notLoading">
        <i class="fa-solid fa-spinner fa-spin"></i>
        Connexion en cours
      </ng-container>
      <ng-template #notLoading>
        Connexion
        <i class="fa-solid fa-arrow-right"></i>
      </ng-template>
    </button>

    <!-- Lien inscription -->
    <p class="text-center text-gray-400 text-sm mt-2">
      Vous n'avez pas de compte ?
      <a routerLink="/inscription" class="font-bold" style="color: #2E7D32;">S'inscrire</a>
    </p>
  </form>
</div>
