<ng-container [ngSwitch]="currentStep()">

  <!-- ÉTAPE 1 -->

  <app-inscription-infos
    *ngSwitchCase="1"

    [step]="currentStep()"

    [totalSteps]="totalSteps"

    [form]="inscriptionForm"

    [loading]="loading()"

    [errorMessage]="errorMessage()"

    (continuer)="inscription()"
  />


  <!-- ÉTAPE 2 -->

  <app-inscription-verification
    *ngSwitchCase="2"

    [step]="currentStep()"

    [totalSteps]="totalSteps"

    [email]="inscriptionForm.controls.email.value"

    [loading]="loading()"

    [errorMessage]="errorMessage()"

    (retour)="precedent()"

    (verifier)="verifierOtp($event)"
  />


  <!-- ÉTAPE 3 -->

  <app-inscription-permissions
    *ngSwitchCase="3"

    [step]="currentStep()"

    [totalSteps]="totalSteps"

    (autoriser)="terminerInscription()"

    (plusTard)="terminerInscription()"
  />

</ng-container>
