<div class="min-h-screen bg-white px-6 pb-10 pt-12">
  <div class="mx-auto max-w-md">

    <button type="button" (click)="retour.emit()" aria-label="Retour" class="flex size-12 items-center justify-center rounded-full bg-white shadow-md">
      <i class="fa-solid fa-arrow-left text-[#A9663D]" aria-hidden="true"></i>
    </button>

    <h1 class="mt-8 text-2xl font-extrabold tracking-tight text-[#A9663D]">Vérification</h1>

    <p class="mt-3 text-base leading-6 text-[#A9663D]/80">
      Nous avons envoyé un code de confirmation
      au <span class="font-bold text-zinc-800">+221 77 ●●● ●● 89</span>
    </p>

    <!-- Champs OTP -->
    <div class="mt-8 flex justify-between gap-4">
      <div class="flex size-16 items-center justify-center rounded-2xl border border-slate-200 text-2xl font-bold text-zinc-800">4</div>
      <div class="flex size-16 items-center justify-center rounded-2xl border border-slate-200 text-2xl font-bold text-zinc-800">8</div>
      <div class="flex size-16 items-center justify-center rounded-2xl border border-slate-200">
        <span class="size-2.5 rounded-full bg-slate-300"></span>
      </div>
      <div class="flex size-16 items-center justify-center rounded-2xl border border-slate-200">
        <span class="size-2.5 rounded-full bg-slate-300"></span>
      </div>
    </div>

    <button
      type="button"
      (click)="verifier.emit()"
      class="mt-8 w-full rounded-2xl bg-[#2E7D32] py-4 text-base font-bold text-white shadow-lg shadow-[#2E7D32]/30"
    >
      Vérifier le code
    </button>

    <div class="mt-6 text-center">
      <button type="button" (click)="renvoyer.emit()" class="text-base font-bold text-green-700">
        Renvoyer le code
      </button>
      <p class="mt-1 text-sm text-stone-400">Disponible dans 0:54</p>
    </div>

    <p class="mt-20 text-center text-sm text-[#A9663D]/70">
      Étape <span class="font-bold text-[#A9663D]">{{ step }} sur {{ totalSteps }}</span>
    </p>
  </div>
</div>
