<div class="min-h-screen w-full overflow-x-hidden bg-[#eef0ef]">
  <!-- ====================================================== -->
  <!-- CARTE -->
  <!-- ====================================================== -->

  <section class="relative h-[455px] w-full overflow-hidden sm:h-[500px] md:h-[560px] lg:h-[620px]">
    <!-- IMAGE DE LA CARTE -->

    <img
      src="/assets/images/map-dakar.png"
      alt="Carte de Dakar"
      class="absolute inset-0 h-full w-full object-cover"
    />

    <!-- VOILE -->

    <div class="absolute inset-0 bg-white/10"></div>

    <!-- ================================================== -->
    <!-- RECHERCHE -->
    <!-- ================================================== -->

    <div
      class="absolute left-4 right-4 top-5 z-20 flex items-center gap-3 sm:left-6 sm:right-6 sm:top-6 sm:gap-4 lg:left-8 lg:right-8 lg:top-8"
    >
      <!-- Barre de recherche -->

      <div
        class="flex h-12 min-w-0 flex-1 items-center gap-3 rounded-[18px] bg-white px-4 shadow-[0_5px_15px_rgba(0,0,0,0.12)] sm:h-14 sm:rounded-[20px] sm:px-5 lg:max-w-[700px]"
      >
        <i class="fa-solid fa-magnifying-glass text-[16px] text-[#91a0b6] sm:text-[18px]"></i>

        <input
          type="text"
          placeholder="Rechercher à Dakar..."
          class="min-w-0 flex-1 bg-transparent text-sm text-[#52627a] outline-none placeholder:text-[#9ba6b7] sm:text-base"
        />
      </div>

      
    </div>

    <!-- ================================================== -->
    <!-- FILTRES -->
    <!-- ================================================== -->

    <div
      class="absolute left-4 right-4 top-[102px] z-20 flex gap-2 overflow-x-auto pb-1 scrollbar-hide sm:left-6 sm:right-6 sm:top-[120px] sm:gap-3 lg:left-8 lg:top-[135px]"
    >
      <button
        class="shrink-0 rounded-full bg-[#2e7d32] px-4 py-2 text-xs font-extrabold text-white sm:px-5 sm:py-2.5 sm:text-sm"
      >
        derniers
      </button>

      <button
        class="shrink-0 rounded-full bg-white px-4 py-2 text-xs font-extrabold text-[#64748b] sm:px-5 sm:py-2.5 sm:text-sm"
      >
        critique
      </button>

      <button
        class="shrink-0 rounded-full bg-white px-4 py-2 text-xs font-extrabold text-[#64748b] sm:px-5 sm:py-2.5 sm:text-sm"
      >
        modéré
      </button>

      <button
        class="shrink-0 rounded-full bg-white px-4 py-2 text-xs font-extrabold text-[#64748b] sm:px-5 sm:py-2.5 sm:text-sm"
      >
        léger
      </button>
    </div>

    <!-- ================================================== -->
    <!-- MARQUEURS -->
    <!-- ================================================== -->

    <!-- Position utilisateur -->

    <div
      class="absolute left-[33%] top-[45%] z-10 flex h-11 w-11 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border-[3px] border-white bg-blue-600 text-white shadow-[0_0_0_9px_rgba(59,130,246,0.16)] sm:h-12 sm:w-12"
    >
      <i class="fa-solid fa-location-dot text-base"></i>
    </div>

    <!-- Marqueur vert -->

    <div
      class="absolute left-[56%] top-[45%] z-10 flex h-11 w-11 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border-[3px] border-white bg-[#2e7d32] text-white sm:h-12 sm:w-12"
    >
      <i class="fa-solid fa-lightbulb text-base"></i>
    </div>

    <!-- Marqueur rouge -->

    <div
      class="absolute left-[87%] top-[45%] z-10 flex h-11 w-11 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border-[3px] border-white bg-[#d62828] text-white sm:h-12 sm:w-12"
    >
      <i class="fa-solid fa-trash text-base"></i>
    </div>

    <!-- Rouge gauche -->

    <div
      class="absolute left-[10%] top-[61%] z-10 flex h-10 w-10 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border-[3px] border-white bg-[#d62828] text-white"
    >
      <i class="fa-solid fa-trash text-sm"></i>
    </div>

    <!-- Orange -->

    <div
      class="absolute left-[71%] top-[54%] z-10 flex h-10 w-10 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border-[3px] border-white bg-orange-500 text-white"
    >
      <i class="fa-solid fa-faucet-drip text-sm"></i>
    </div>

    <!-- Orange gauche -->

    <div
      class="absolute left-[22%] top-[72%] z-10 flex h-10 w-10 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border-[3px] border-white bg-orange-500 text-white"
    >
      <i class="fa-solid fa-faucet-drip text-sm"></i>
    </div>

    <!-- ================================================== -->
    <!-- CONTROLES CARTE -->
    <!-- ================================================== -->

    <div class="absolute right-4 top-[66%] z-20 flex flex-col gap-3 sm:right-6 sm:gap-4 lg:right-8">
      <button
        type="button"
        class="flex h-12 w-12 items-center justify-center rounded-[17px] bg-white text-[#334155] shadow-lg sm:h-14 sm:w-14"
      >
        <i class="fa-solid fa-crosshairs text-lg"></i>
      </button>

      <button
        type="button"
        class="flex h-12 w-12 items-center justify-center rounded-[17px] bg-white text-[#334155] shadow-lg sm:h-14 sm:w-14"
      >
        <i class="fa-solid fa-layer-group text-lg"></i>
      </button>
    </div>
  </section>

  <!-- ====================================================== -->
  <!-- À PROXIMITÉ -->
  <!-- ====================================================== -->

  <section
    class="relative z-30 -mt-7 w-full rounded-t-[35px] bg-white px-5 pb-28 pt-4 shadow-[0_-5px_25px_rgba(15,23,42,0.08)] sm:px-7 sm:pt-5 lg:mx-auto lg:-mt-10 lg:max-w-[610px] lg:rounded-[35px]"
  >
    <!-- HANDLE -->

    <div class="mx-auto mb-5 h-1 w-12 rounded-full bg-[#e0e6ed] sm:h-1.5 sm:w-16"></div>

    <!-- TITRE -->

    <h2 class="text-[21px] font-black leading-7 tracking-tight text-[#111827] sm:text-[23px]">
      À proximité
    </h2>

    <p class="mt-1 text-sm font-medium text-[#657792] sm:text-base">
      3 signalements urgents trouvés
    </p>

    <!-- ================================================== -->
    <!-- CARTE SIGNALement -->
    <!-- ================================================== -->

    <article
      class="mt-7 overflow-hidden rounded-[30px] border border-[#edf1f4] bg-white shadow-[0_2px_7px_rgba(15,23,42,0.06)] sm:mt-9 sm:rounded-[34px]"
    >
      <!-- IMAGE -->

      <div class="relative h-[215px] w-full sm:h-[260px] lg:h-[280px]">
        <img
          src="/assets/images/signalements/dechets-port.jpg"
          alt="Nettoyage Rue du port"
          class="h-full w-full object-cover"
        />

        <!-- DATE -->

        <div
          class="absolute left-5 top-8 rounded-full bg-white px-4 py-2 text-[11px] font-black text-[#2e7d32] shadow-sm sm:left-7 sm:top-5 sm:px-5 sm:text-xs"
        >
          05 MAI 2026 13H05
        </div>
      </div>

      <!-- CONTENU -->

      <div class="px-5 pb-6 pt-5 sm:px-7 sm:pb-7 sm:pt-6">
        <!-- TITRE -->

        <div class="flex items-start justify-between gap-4">
          <h3 class="text-[19px] font-black leading-6 text-[#111827] sm:text-[22px] sm:leading-7">
            Nettoyage Rue du port
          </h3>

          <button type="button" class="shrink-0 text-[#91a4bc]">
            <i class="fa-regular fa-bookmark text-[20px]"></i>
          </button>
        </div>

        <!-- LOCALISATION -->

        <div class="mt-3 flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-[17px] text-[#2e7d32]"></i>

          <span class="text-sm font-medium text-[#657792] sm:text-base">
            Boulevard de la Plage
          </span>
        </div>

        <!-- BOUTON -->

        <button
          type="button"
          class="mt-6 h-12 w-full rounded-[18px] bg-[#2e7d32] text-sm font-extrabold text-white shadow-[0_8px_18px_rgba(46,125,50,0.20)] sm:h-14 sm:rounded-[20px] sm:text-base"
        >
          Plus d’info
        </button>
      </div>
    </article>
  </section>

  <!-- NAVBAR -->

  <app-navbar></app-navbar>
</div>
