<div class="min-h-screen bg-white flex flex-col items-center justify-center px-8 text-center">
  <!-- Logo -->
  <div class="flex items-center mb-8">
    <img src="images/logo.png" alt="Andë sétal" class="h-30 w-auto" />
  </div>

  <!-- Icône succès -->
  <div class="w-24 h-24 rounded-full bg-green-100 flex items-center justify-center mb-8">
    <div class="w-16 h-16 rounded-full bg-green-600 flex items-center justify-center">
      <i class="fa-solid fa-check text-white text-2xl"></i>
    </div>
  </div>

  <!-- Message -->
  <h1 class="text-2xl font-extrabold text-gray-900 leading-snug mb-3">
    Merci pour votre engagement !
  </h1>
  <p class="text-gray-400 text-base leading-relaxed mb-10">
    Un geste de citoyenneté pour un cadre de vie meilleur !
  </p>

  <!-- Action -->
  <button
    type="button"
    (click)="goHome()"
    class="rounded-2xl bg-green-700 text-white font-bold px-8 py-4 flex items-center gap-2 active:scale-[0.99] transition"
  >
    Retour à l'accueil
    <i class="fa-solid fa-arrow-right"></i>
  </button>
</div>
