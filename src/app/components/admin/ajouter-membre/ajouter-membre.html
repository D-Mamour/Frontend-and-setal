<div
  *ngIf="ouvert"
  class="fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 p-4"
  (click)="fermer.emit()"
>
  <div
    class="w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl sm:p-8"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between">
      <h2 class="text-lg font-extrabold text-zinc-900">Ajouter un nouveau membre</h2>
      <button
        type="button"
        (click)="fermer.emit()"
        aria-label="Fermer"
        class="flex size-9 items-center justify-center rounded-full text-slate-400 hover:bg-slate-100"
      >
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <form class="mt-6 flex flex-col gap-5">

      <div>
        <label for="nom" class="text-sm font-bold text-zinc-900">Nom</label>
        <input
          id="nom"
          type="text"
          placeholder="Sarr"
          class="mt-2 w-full rounded-2xl bg-slate-100 px-5 py-4 text-sm text-zinc-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-green-700/30"
        />
      </div>

      <div>
        <label for="prenom" class="text-sm font-bold text-zinc-900">Prénom</label>
        <input
          id="prenom"
          type="text"
          placeholder="Sarr"
          class="mt-2 w-full rounded-2xl bg-slate-100 px-5 py-4 text-sm text-zinc-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-green-700/30"
        />
      </div>

      <div>
        <label for="poste" class="text-sm font-bold text-zinc-900">Poste</label>
        <div class="relative mt-2">
          <select
            id="poste"
            class="w-full appearance-none rounded-2xl bg-slate-100 px-5 py-4 text-sm text-slate-400 focus:outline-none focus:ring-2 focus:ring-green-700/30"
          >
            <option value="" disabled selected>Choisir le rôle</option>
            <option value="agent">Agent</option>
            <option value="validateur">Validateur</option>
            <option value="super-admin">Super Admin</option>
          </select>
          <i class="fa-solid fa-check pointer-events-none absolute right-5 top-1/2 -translate-y-1/2 text-zinc-800" aria-hidden="true"></i>
        </div>
      </div>

      <div>
        <label for="email" class="text-sm font-bold text-zinc-900">Email</label>
        <input
          id="email"
          type="email"
          placeholder="votre.email@exemple.com"
          class="mt-2 w-full rounded-2xl bg-slate-100 px-5 py-4 text-sm text-zinc-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-green-700/30"
        />
      </div>
    </form>

    <button
      type="button"
      class="mt-8 flex w-full items-center justify-center gap-2 rounded-2xl bg-[#2E7D32] py-4 text-base font-bold text-white shadow-lg shadow-[#2E7D32]/30"
    >
      Créer
      <i class="fa-solid fa-arrow-right text-sm" aria-hidden="true"></i>
    </button>
  </div>
</div>
