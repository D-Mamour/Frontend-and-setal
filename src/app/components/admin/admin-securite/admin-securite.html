<div class="min-h-screen bg-slate-50">
  <!-- CONTENT : reserve space for 64px sidebar -->
  <main class="ml-64 mt-20 min-h-screen bg-white px-6 lg:px-8 xl:px-10 py-8">

    <!-- STATISTIQUES -->
    <section class="flex flex-col lg:flex-row lg:items-center gap-6 py-8">
      <!-- Nombres Agents -->
      <div class="w-full lg:w-64 min-h-[94px] px-5 py-5 rounded-3xl border border-slate-100 bg-white shadow-sm flex items-center gap-4">

        <div>
          <p class="text-[11px] font-bold tracking-wide text-slate-400 uppercase">Agents</p>
          <p class="mt-1 text-2xl font-bold text-slate-800">0</p>
        </div>
      </div>

      <!-- Nombres citoyens -->
       <div class="w-full lg:w-64 min-h-[94px] px-5 py-5 rounded-3xl border border-slate-100 bg-white shadow-sm flex items-center gap-4">

        <div>
          <p class="text-[11px] font-bold tracking-wide text-slate-400 uppercase">Citoyen</p>
          <p class="mt-1 text-2xl font-bold text-slate-800">1</p>
        </div>
      </div>

    </section>

    <!-- ONGLETS -->
    <section class="border-b border-slate-200">
      <div class="flex items-center gap-10">
        <!-- Actif -->
        <button class="relative flex items-center gap-3 py-4 text-sm font-bold text-green-700">
          <i class="fa-solid fa-users-gear"></i>
          <span>Utilisateurs de la plateforme</span>

        </button>

      </div>
    </section>

    <!-- GESTION DES GÉRANTS -->
    <section class="mt-8 bg-white border border-slate-100 rounded-[28px] shadow-sm overflow-hidden">
      <!-- Header du tableau -->
      <div class="px-6 lg:px-7 py-6 flex flex-col md:flex-row md:items-center md:justify-between gap-5">
        <div>
          <h2 class="text-xl font-bold text-slate-800">Gestion des Gérants</h2>
          <p class="mt-1 text-sm text-slate-400">12 gérants configurés dans le système</p>
        </div>

        <!-- Ajouter -->
        <button (click)="afficherModalAjout = true" class="inline-flex items-center justify-center gap-3 px-6 py-3 rounded-2xl bg-green-700 hover:bg-green-800 text-white text-sm font-bold shadow-lg shadow-green-700/20 transition">
          <i class="fa-solid fa-user-plus"></i>
          Ajouter un nouveau membre
        </button>
      </div>

      <!-- Tableau -->
      <div class="overflow-x-auto">
        <table class="w-full min-w-[850px]">
          <thead>
            <tr class="bg-slate-50 border-y border-slate-100">
              <th class="px-6 py-4 text-left text-[11px] font-bold tracking-wider text-slate-400 uppercase">Utilisateur</th>
              <th class="px-6 py-4 text-left text-[11px] font-bold tracking-wider text-slate-400 uppercase">Rôle</th>
              <th class="px-6 py-4 text-left text-[11px] font-bold tracking-wider text-slate-400 uppercase">Dernière connexion</th>
              <th class="px-6 py-4 text-left text-[11px] font-bold tracking-wider text-slate-400 uppercase">Statut</th>
              <th class="px-6 py-4 text-right text-[11px] font-bold tracking-wider text-slate-400 uppercase">Actions</th>
            </tr>
          </thead>

          <tbody class="divide-y divide-slate-100">
            <!-- Moussa -->
            <tr class="hover:bg-slate-50 transition">
              <td class="px-6 py-5">
                <div>
                  <p class="font-bold text-slate-700">Moussa Diouf</p>
                  <p class="text-xs text-slate-400">m.diouf@andesetal.sn</p>
                </div>
              </td>

              <td class="px-6 py-5">
                <span class="inline-flex px-3 py-1 rounded-2xl bg-purple-50 border border-purple-100 text-xs font-semibold text-purple-600">Agent</span>
              </td>

              <td class="px-6 py-5">
                <p class="text-sm text-slate-600">Aujourd'hui, 14:42</p>
                <p class="text-xs text-slate-400">IP: 197.234.xx.xx</p>
              </td>

              <td class="px-6 py-5">
                <div class="flex items-center gap-3">
                  <span class="relative w-10 h-6 rounded-full bg-emerald-500"><span class="absolute right-1 top-1 w-4 h-4 rounded-full bg-white"></span></span>
                  <span class="text-sm font-bold text-emerald-600">ACTIF</span>
                </div>
              </td>

              <td class="px-6 py-5">
                <div class="flex items-center justify-end gap-6">
                  <p class="text-sm text-slate-600">voir plus</p>
                </div>
              </td>
            </tr>

            <!-- autres lignes du tableau... -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- JOURNAUX D'AUDIT -->

  </main>
</div>

<app-ajouter-membre
  [ouvert]="afficherModalAjout"
  (fermer)="afficherModalAjout = false"
  />
